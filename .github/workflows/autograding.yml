name: Autograding

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  autograding:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instalar dependências
        run: npm install --no-audit --no-fund

      - name: Gerar Prisma Client
        run: npx prisma generate

      - name: Aplicar migrations
        env:
          DATABASE_URL: file:./dev.db
        run: npx prisma migrate deploy

      - name: Subir o servidor
        env:
          DATABASE_URL: file:./dev.db
        run: |
          PORT=3000 npm start &
          sleep 3

      - name: Rodar autograder de conformidade
        run: BASE_URL=http://localhost:3000 node autograder/check.mjs